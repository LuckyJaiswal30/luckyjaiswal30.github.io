name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches anything the unit tests can't: a broken MDX compile, a bad
      # frontmatter value, a server/client boundary violation. The build is the
      # real smoke test for a static site.
      - name: Build
        run: npm run build
